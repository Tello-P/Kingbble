name: Release

# Builds the desktop app for Linux (AppImage, .deb) and Windows (installer, portable
# .zip) with the engine, ENABLE and Kingbble's own ENABLE leaves inside, so it needs
# no Python and no compiler. A tag vX.Y.Z also makes a DRAFT release with the files
# and their SHA-256; publish it by hand after a look. Pull requests and the Actions
# tab (workflow_dispatch) only build the files.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "engine/**", "CMakeLists.txt", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # x86-64-v2 (SSE4.2, POPCNT): any x86-64 CPU from about 2009 on. Measured as fast
  # as x86-64-v3 for the engine; the bare x86-64 baseline is about 12 % slower.
  ARCH: x86-64-v2

jobs:
  linux:
    name: Linux (AppImage, .deb)
    # The oldest supported runner: the bridge then needs only an older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the bridge and the tests
        run: |
          cmake -S . -B build -DKINGBBLE_ARCH=$ARCH -DKINGBBLE_TOOLS=OFF -DKINGBBLE_STATIC_RUNTIME=ON
          cmake --build build -j --target kingbble_bridge engine_tests
      - name: Engine tests
        run: ctest --test-dir build --output-on-failure -j 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the engine, ENABLE and its leaves
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node stage.js --build ../build
          node smoke.js
      - name: Package
        working-directory: desktop
        run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (installer, portable .zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build the bridge and the tests (MinGW, static)
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DKINGBBLE_ARCH=$ARCH -DKINGBBLE_TOOLS=OFF
          cmake --build build --target kingbble_bridge engine_tests
      - name: Engine tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure -j 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the engine, ENABLE and its leaves
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node stage.js --build ../build
          node smoke.js
      - name: Package
        working-directory: desktop
        run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v {p=1; next} /^## / {p=0} p' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --draft --title "Kingbble $TAG" --notes "$notes"
          fi
