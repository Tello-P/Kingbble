[project]
name = "kingbble"
version = "0.0.1"
description = "Scrabble bot with Bayesian opponent-rack inference and RL"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["duckdb>=1.0", "pyarrow>=15"]

[tool.setuptools.packages.find]
include = ["ml*", "app*"]

[tool.ruff]
line-length = 100
extend-exclude = ["build*"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["."]
